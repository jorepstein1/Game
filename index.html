<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearthold — a medieval idle city builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- #app holds one <section class="screen"> per game mode; ui.js shows exactly one at a time. -->
<div id="app">
  <section class="screen" id="screen-city" data-screen="city">
    <header>
      <h1><svg class="sp" viewBox="0 0 32 32" aria-hidden="true"><use href="#sp-crown"/></svg> Hearthold</h1>
      <span id="subtitle"></span>
    </header>
    <div id="res" aria-label="Resources"></div>
    <main>
      <section id="left">
        <div id="mapwrap">
          <div id="mapscroll"><div id="map"></div></div>
          <div id="maphint" hidden>Drag the map to pan</div>
          <button id="merchant" data-act="merchant" hidden title="A travelling merchant!" aria-label="Travelling merchant: tap for a gift"><svg class="sp" viewBox="0 0 32 32" aria-hidden="true"><use href="#sp-merchant"/></svg></button>
        </div>
        <!-- On phones ui.js moves #inspector in here, beside the button, so both sit under the map. -->
        <div id="strip"><button id="clicker" data-act="collect"><span class="lbl"><svg class="sp" viewBox="0 0 32 32" aria-hidden="true"><use href="#sp-gold"/></svg> Collect Taxes</span> <small id="clickval"></small></button></div>
      </section>
      <!-- Phones only: the build list, or the selected tile's actions. -->
      <div id="buildbar"><div id="bbinfo"></div><div id="bbrow"></div></div>
      <!-- On phones this is the tab row along the bottom, and #panel is a sheet that slides up from it. -->
      <aside id="side">
        <div id="inspector"></div>
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </aside>
    </main>
  </section>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal" hidden><div id="modalbox" role="dialog" aria-modal="true" aria-labelledby="modaltitle"></div></div>
<script src="data.js"></script>
<script src="sprites.js"></script>
<script src="sim.js"></script>
<script src="ui.js"></script>
</body>
</html>
